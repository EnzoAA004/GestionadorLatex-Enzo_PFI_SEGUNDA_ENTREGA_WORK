name: Temporary LaTeX validation

on:
  workflow_dispatch:
  push:
    branches:
      - integration/latex-canonical

jobs:
  latex-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4

      - name: Remove tracked LaTeX build products
        shell: bash
        run: |
          rm -f main.aux main.bbl main.bcf main.blg main.fdb_latexmk main.fls \
            main.log main.lof main.lot main.out main.pdf main.run.xml main.toc main.upa

      - name: Compile main.tex with Biber
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          args: -pdf -interaction=nonstopmode -file-line-error

      - name: Validate build outputs and document structure
        shell: bash
        run: |
          set -euo pipefail

          test -s main.pdf
          test -s main.bbl
          test -s main.blg
          echo "Build artifacts: PASS"

          echo "Reference warning count: $(grep -Fc 'LaTeX Warning: Reference' main.log || true)"
          echo "Undefined summary count: $(grep -Fc 'There were undefined references' main.log || true)"
          if grep -Fq 'LaTeX Warning: Reference' main.log; then
            echo 'Undefined LaTeX references detected.' >&2
            grep -Fn 'LaTeX Warning: Reference' main.log >&2
            exit 1
          fi

          if grep -Fq 'There were undefined references' main.log; then
            echo 'Undefined references summary detected.' >&2
            grep -Fn 'There were undefined references' main.log >&2
            exit 1
          fi

          grep -Fq 'This is Biber' main.blg
          echo "Biber: PASS"

          for appendix in a b c d e f g h; do
            grep -Fq "\\input{appendices/anexo_${appendix}_" main.tex
          done
          echo "Appendices A-H: PASS"

          model_line=$(grep -nF '\input{chapters/capitulo_15_modelo_negocio}' main.tex | cut -d: -f1 || true)
          plan_line=$(grep -nF '\input{chapters/capitulo_14_planificacion_academica}' main.tex | cut -d: -f1 || true)
          test "$model_line" -lt "$plan_line"
          echo "Chapter input order: PASS"

          toc_model=$(grep -ni 'modelo.*negocio' main.toc | head -n1 | cut -d: -f1)
          toc_plan=$(grep -ni 'planificaci' main.toc | head -n1 | cut -d: -f1)
          test -n "$toc_model"
          test -n "$toc_plan"
          test "$toc_model" -lt "$toc_plan"
          echo "Chapter TOC order: PASS"

          pdf_line=$(grep -E 'Output written on main\.pdf \([0-9]+ pages, [0-9]+ bytes\)' main.log | tail -n1 || true)
          test -n "$pdf_line"
          pages=$(printf '%s\n' "$pdf_line" | sed -E 's/.*\(([0-9]+) pages.*/\1/')
          bytes=$(printf '%s\n' "$pdf_line" | sed -E 's/.*pages, ([0-9]+) bytes.*/\1/')
          test "${pages:-0}" -gt 0
          test "$bytes" -gt 0
          printf 'PDF pages: %s\nPDF bytes: %s\n' "$pages" "$bytes" | tee pdfinfo.txt
          echo "PDF pages: $pages"
          echo "PDF bytes: $bytes"

      - name: Upload validated PDF and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: latex-canonical-validation
          path: |
            main.pdf
            main.log
            main.blg
            pdfinfo.txt
