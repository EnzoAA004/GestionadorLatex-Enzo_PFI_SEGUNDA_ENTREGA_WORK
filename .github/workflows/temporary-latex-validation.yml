name: Temporary LaTeX validation

on:
  workflow_dispatch:
  push:
    branches:
      - integration/latex-canonical

jobs:
  latex-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4

      - name: Compile main.tex with Biber
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          args: -pdf -interaction=nonstopmode -file-line-error

      - name: Validate build outputs and document structure
        shell: bash
        run: |
          set -euo pipefail

          test -s main.pdf
          test -s main.bbl
          test -s main.blg

          if grep -Fq 'LaTeX Warning: Reference' main.log; then
            echo 'Undefined LaTeX references detected.' >&2
            grep -Fn 'LaTeX Warning: Reference' main.log >&2
            exit 1
          fi

          if grep -Fq 'There were undefined references' main.log; then
            echo 'Undefined references summary detected.' >&2
            grep -Fn 'There were undefined references' main.log >&2
            exit 1
          fi

          grep -Fq 'INFO - This is Biber' main.blg

          for appendix in a b c d e f g h; do
            grep -Fq "\\input{appendices/anexo_${appendix}_" main.tex
          done

          model_line=$(grep -nF '\\input{chapters/capitulo_15_modelo_negocio}' main.tex | cut -d: -f1)
          plan_line=$(grep -nF '\\input{chapters/capitulo_14_planificacion_academica}' main.tex | cut -d: -f1)
          test "$model_line" -lt "$plan_line"

          toc_model=$(grep -nF 'Modelo de negocio' main.toc | head -n1 | cut -d: -f1)
          toc_plan=$(grep -nF 'Planificación académica' main.toc | head -n1 | cut -d: -f1)
          test -n "$toc_model"
          test -n "$toc_plan"
          test "$toc_model" -lt "$toc_plan"

          pdfinfo main.pdf | tee pdfinfo.txt
          pages=$(awk -F: '/^Pages:/ {gsub(/ /, "", $2); print $2}' pdfinfo.txt)
          bytes=$(stat -c '%s' main.pdf)
          test "${pages:-0}" -gt 0
          test "$bytes" -gt 0
          echo "PDF pages: $pages"
          echo "PDF bytes: $bytes"

      - name: Upload validated PDF and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: latex-canonical-validation
          path: |
            main.pdf
            main.log
            main.blg
            pdfinfo.txt
